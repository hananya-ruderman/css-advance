<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agency</title>
    <link rel="stylesheet" href="agency.css">
</head>
<body>
    <div class="wrapper">
        <header class="">
            <img class="grin-color" id="logo" src="https://cdn.discordapp.com/attachments/1422164469110538303/1466336844240126135/shield.png?ex=697c601a&is=697b0e9a&hm=b0ec8c4e0da74d69b1d31c3d6e98dab0bf8d4cc03866233a723a4d58ead4488a&" alt="">
            <p class="grin-color">SIGINT OPS</p>
            <button class="grin-color nav-button">
                <ul>
                    <li>source</li>
                    <li>online</li>
                </ul>
            </button>
        </header>
        <main>
            <div class="main-part ">
                <div class="grid-rader">
                    <div class='radar'>
                        <div class='sweep'></div>
                    </div>
                </div>
                <div class="details">
                <p class="white-color"><span class="grin-color">24</span> active signals</p>
                <p class="white-color"><span class="grin-color">07</span>priority alerts</p>
                </div>
            </div>
            <div class="button-part grin-border">
                <button class="white-color grin-border">new brief</button>
                <button class="white-color grin-border">decode</button>
                <button class="white-color grin-border">request drone</button>
            </div>
            <div class="specific-data ">
                <div class="first box grin-border">
                    <section class="above">
                        <button>critical</button>
                        <p class="white-color">in progres</p>
                    </section>
                    <p class="white-color">operation nightfull</p>
                    <section></section>
                </div>
                <div class="seconed box grin-border">
                    <section class="above">
                        <button>high</button>
                        <p class="white-color">analizing</p>
                    </section>
                    <p class="white-color">signal intercept alpha</p>
                    <section></section>
                </div>
                <div class="third box grin-border">
                    <section class="above">
                        <button>medium</button>
                        <p class="white-color">pending</p>
                    </section>
                    <p class="white-color">Asset Recovery</p>
                    <section></section>
                </div>
                <div class="forth box grin-border">
                    <section class="above">
                        <button>high</button>
                        <p class="white-color">active</p>
                    </section>
                    <p class="white-color">Ciber degence grid</p>
                    <section></section>
                </div>

            </div>
            <div class="last">
            <button class="last-button white-color">THRED DETECTED</button>
                </div>
        </main>
    </div>
    <footer>
        <div class="white-color">
            <div></div>
            <p>dashboard</p>
        </div>
        <div class="white-color">
            <div></div>
            <p>feed</p>
        </div>
        <div class="white-color">
            <div></div>
            <p>brief</p>
        </div>
    </footer>
</body>
</html>
